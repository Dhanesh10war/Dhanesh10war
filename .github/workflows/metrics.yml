name: Analytics Metrics (3D isocalendar + panels)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dhanesh10war
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # --- 3D isometric contribution calendar (the "skyline in a README" plugin) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- extra analytical panels ---
          plugin_languages: yes
          plugin_languages_analysis_timezone: Asia/Kolkata
          plugin_languages_analysis_timeout: 45
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%

          plugin_lines: yes
          plugin_lines_history_limit: 15

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_achievements: yes
          plugin_achievements_threshold: C

          output_action: svg
